name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  UV_VERSION: "0.5.11"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync --locked --all-groups
      - name: Lock check
        run: uv lock --check
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src scripts
      - name: Import boundaries
        run: uv run lint-imports
      - name: Docs validation
        run: uv run python scripts/validate_docs.py
      - name: Repository hygiene
        run: uv run python scripts/check_repository_hygiene.py

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync --locked --all-groups
      - name: Unit, contract, property tests
        run: uv run pytest tests/unit tests/contracts tests/property --cov=mesoforge --cov-report=term-missing -q

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesoforge
          POSTGRES_PASSWORD: mesoforge_test
          POSTGRES_DB: mesoforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesoforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: mesoforge_test
          MINIO_ROOT_PASSWORD: mesoforge_test_password
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MESOFORGE_TEST_DATABASE_DSN: "postgresql+psycopg://mesoforge:mesoforge_test@localhost:5432/mesoforge"
      MESOFORGE_TEST_S3_ENDPOINT: "http://localhost:9000"
      MESOFORGE_TEST_S3_ACCESS_KEY: "mesoforge_test"
      MESOFORGE_TEST_S3_SECRET_KEY: "mesoforge_test_password"
      MESOFORGE_TEST_S3_BUCKET: "mesoforge-test"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync --locked --all-groups
      - name: Migration upgrade
        run: uv run alembic upgrade head
      - name: Integration and acceptance tests
        run: uv run pytest -m integration tests/acceptance -q
