name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  UV_VERSION: "0.5.11"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync --locked --all-groups
      - name: Lock check
        run: uv lock --check
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src scripts
      - name: Import boundaries
        run: uv run lint-imports
      - name: Docs validation
        run: uv run python scripts/validate_docs.py
      - name: Repository hygiene
        run: uv run python scripts/check_repository_hygiene.py

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync --locked --all-groups
      - name: Unit, contract, property tests
        run: uv run pytest tests/unit tests/contracts tests/property --cov=mesoforge --cov-report=term-missing -q

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesoforge
          POSTGRES_PASSWORD: mesoforge_test
          POSTGRES_DB: mesoforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesoforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: mesoforge_test
          MINIO_ROOT_PASSWORD: mesoforge_test_password
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both env var names point at the same real postgres:16 service
      # container declared above. MESOFORGE_TEST_DATABASE_DSN is read by
      # tests/conftest.py's postgres_dsn fixture (so tests use this
      # declared service rather than unconditionally spawning pgserver);
      # MESOFORGE_ALEMBIC_DSN is the exact variable name
      # migrations/env.py's _get_url() recognizes (it accepts
      # MESOFORGE_ALEMBIC_DSN or MESOFORGE_DATABASE_DSN -- MESOFORGE_ALEMBIC_DSN
      # is set explicitly here so `uv run alembic upgrade/downgrade` at
      # the shell level works without a test fixture setting it first).
      MESOFORGE_TEST_DATABASE_DSN: "postgresql+psycopg://mesoforge:mesoforge_test@localhost:5432/mesoforge"
      MESOFORGE_ALEMBIC_DSN: "postgresql+psycopg://mesoforge:mesoforge_test@localhost:5432/mesoforge"
      MESOFORGE_TEST_S3_ENDPOINT: "http://localhost:9000"
      MESOFORGE_TEST_S3_ACCESS_KEY: "mesoforge_test"
      MESOFORGE_TEST_S3_SECRET_KEY: "mesoforge_test_password"
      MESOFORGE_TEST_S3_BUCKET: "mesoforge-test"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync --locked --all-groups
      - name: Migration upgrade / downgrade / upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Integration and acceptance tests
        run: uv run pytest -m integration tests/integration tests/acceptance -q
