        parameter_category: 2
        parameter_number: 22
        type_of_level: surface
        level: 0.0
        expected_unit_id: "m/s"
      - canonical_variable_id: liquid_equivalent_precipitation_amount_1h
        discipline: 0
        parameter_category: 1
        parameter_number: 8
        type_of_level: surface
        level: 0.0
        expected_unit_id: "kg/m^2"
        is_accumulation: true
    read_keys:
      - discipline
      - parameterCategory
      - parameterNumber
      - typeOfLevel
      - level
      - stepType
      - stepRange
      - startStep
      - endStep
