[project]
name = "mesoforge"
version = "0.1.0"
description = "MesoForge Phase 0 foundations: canonical contracts, provenance, and storage."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "pydantic>=2.10,<3",
    "jcs>=0.2,<1",
    "numpy>=2,<3",
    "xarray>=2025.1,<2027",
    "pint>=0.24,<1",
    "pint-xarray>=0.4,<1",
    "pyproj>=3.7,<4",
    "h5netcdf>=1.4,<2",
    "h5py>=3.12,<4",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "PyYAML>=6,<7",
    "eccodes>=2.48.0",
    "cfgrib>=0.9.15.1",
    "herbie-data>=2026.3.0",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "hypothesis>=6,<7",
    "mypy>=1.14,<2",
    "ruff>=0.9,<1",
    "import-linter>=2.1,<3",
    "pre-commit>=4,<5",
    "pgserver>=0.1.4,<1",
    "boto3-stubs[s3]>=1.35,<2",
    "types-PyYAML>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesoforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"src/mesoforge/common/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jcs", "pint_xarray", "pgserver", "pyarrow", "pyarrow.parquet", "cfgrib", "eccodes"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: requires real PostgreSQL and/or MinIO services",
    "acceptance: end-to-end acceptance proof spanning multiple subsystems",
    "scientific: exercises scientific/numerical formulas (offline, deterministic)",
    "live: requires live network access to an external provider (opt-in only, never run by default CI)",
]
filterwarnings = [
    "error",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mesoforge"]
