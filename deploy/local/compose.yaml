name: mesoforge-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${MESOFORGE_PG_USER:-mesoforge}
      POSTGRES_PASSWORD: ${MESOFORGE_PG_PASSWORD:-mesoforge_local}
      POSTGRES_DB: ${MESOFORGE_PG_DB:-mesoforge}
    ports:
      - "${MESOFORGE_PG_PORT:-55432}:5432"
    volumes:
      - mesoforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MESOFORGE_PG_USER:-mesoforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${MESOFORGE_MINIO_ROOT_USER:-mesoforge_local}
      MINIO_ROOT_PASSWORD: ${MESOFORGE_MINIO_ROOT_PASSWORD:-mesoforge_local_password}
    ports:
      - "${MESOFORGE_MINIO_PORT:-59000}:9000"
      - "${MESOFORGE_MINIO_CONSOLE_PORT:-59101}:9101"
    volumes:
      - mesoforge-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mesoforge-postgres-data:
    name: mesoforge-postgres-data
  mesoforge-minio-data:
    name: mesoforge-minio-data
